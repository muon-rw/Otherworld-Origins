plugins {
    id 'idea'
    id 'eclipse'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0'
    id 'dev.mixinmcp.decompile' version '1.5.0'
}

base {
    archivesName = fileName
}

group = project.properties.modGroup
version = "${project.properties.version}+${project.properties.mc_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(project.properties.javaVersion)

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.mc_version
        mappingsVersion = project.parchment_version
    }
    validateAccessTransformers = true

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
            jvmArgument '-Xmx6G'
            jvmArgument '-Xms2G'
            jvmArgument '-XX:+UseG1GC'
            jvmArgument '-XX:MaxGCPauseMillis=200'
        }
        client {
            client()
            gameDirectory = project.file('run/client')
        }

        clientExtra {
            client()
            gameDirectory = project.file('run/client2')
            programArguments.addAll('--username', 'Dev2')
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }

        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll('--mod', modid, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath)
        }
    }

    mods {
        "${modid}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

// Loom provides `localRuntime` out of the box; MDG does not, so wire it up here.
// Deps in `localRuntime` are on the dev runtime classpath but aren't exposed in
// `runtimeElements`, so they don't propagate transitively to maven consumers.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom(localRuntime)
    testRuntimeClasspath.extendsFrom(localRuntime)
}

repositories {
    mavenCentral()
    mavenLocal()
    flatDir {
        dir 'libs'
        content { includeGroup 'local' }
    }
    flatDir {
        // Dev runtime purpose: RHF's spell addons, resolved from the modpack instance so
        // we have the same spell pool here that the pack does (for spell dump and tag validation)
        name = "RavenPackMods"
        dir "C:\\Users\\renpi\\curseforge\\minecraft\\Instances\\Raven's High Fantasy\\mods"
        content { includeGroup 'pack' }
    }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        // Curios, Caelus
        url "https://maven.theillusivec4.top"
        content {
            includeGroupByRegex "top\\.theillusivec4.*"
            includeGroupByRegex "com\\.illusivesoulworks.*"
        }
    }
    maven {
        // JEI, Bookshelf, Patchouli
        url "https://maven.blamejared.com"
        content {
            includeGroup "vazkii.patchouli"
            includeGroupByRegex "net\\.darkhax.*"
            includeGroupByRegex "com\\.blamejared.*"
            includeGroup "org.openzen.zencode"
            includeGroup "mezz.jei"
        }
    }
    maven {
        // Shadows of Fire
        url "https://maven.shadowsoffire.dev/releases"
        content {
            includeGroup "dev.shadowsoffire"
        }
    }
    maven { url 'https://maven.shedaniel.me/' }            // Cloth Config, Architectury
    maven { url 'https://maven.kosmx.dev/' }               // Player Animator
    maven { url = "https://maven.isxander.dev/releases" }  // YACL
    maven { url = "https://maven.bawnorton.com/releases" } // MixinSquared
    maven {
        // Kotlin for Forge. The maven artifact carries the Kotlin stdlib as a compile dependency;
        // the CurseForge jar nests it, which leaves javac unable to compile against FzzyConfig.
        name = "Kotlin for Forge"
        url = "https://thedarkcolour.github.io/KotlinForForge/"
        content { includeGroup "thedarkcolour" }
    }
    maven { url = "https://maven.muon.rip/releases" }      // Dynamic Difficulty, Raven Core
    maven { url = "https://code.redspace.io/releases" }
    maven { url = "https://code.redspace.io/snapshots" }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        url = uri("https://maven.ftb.dev/releases")
        content {
            includeGroup("dev.latvian.mods")
            includeGroup("dev.ftb.mods")
        }
    }
    maven {
        url = uri("https://maven.ftb.dev/snapshots")
        content {
            includeGroup("dev.latvian.mods")
            includeGroup("dev.ftb.mods")
        }
    }
}

dependencies {
    // MixinSquared's annotationProcessor MUST be registered before Mixin's one.
    // NeoForge bundles fabric-mixin and mixinextras, so neither is declared here.
    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:${mixin_squared_version}"))
    jarJar(implementation("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:${mixin_squared_version}")) {
        version { strictly '[0.3.5-beta.1,)'; prefer "${mixin_squared_version}" }
    }

    // Dev env
    localRuntime("mezz.jei:jei-${mc_version}-neoforge:${jei_version}")
    localRuntime("maven.modrinth:jade:${jade_version}")
    localRuntime("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}") // raven_core's config
    localRuntime("dev.isxander:yet-another-config-lib:${yacl_version}")

    // Raven Core. Non-transitive so its dev runtime doesn't leak into here; its mods.toml requires
    // only aether_villages and legendary_monsters. Aether Villages needs Architectury (already on
    // the FTB line below) and thankfully not The Aether itself, so no Aether in this runtime. If
    // it needs to be added, its bundled accessories needs to be bumped as well.
    implementation("dev.muon:raven-core:${raven_core_version}") { transitive = false }
    localRuntime("curse.maven:aether-villages-1073197:5895490")
    localRuntime("curse.maven:legendary-monsters-944035:8715533")
    // need this to use the obsidian mirror without crashing
    localRuntime("curse.maven:dark-doppelganger-1110803:8472789")
    // raven_core jarJars AEA; compile-visible for the shapeshift width/height attributes.
    compileOnly("maven.modrinth:AdditionalEntityAttributes:${additional_entity_attributes_version}")

    // Origins (Overgrown's fork)
    implementation("maven.modrinth:opoli:${apoli_version}-neoforge,1.21.1")
    implementation("maven.modrinth:overgrowns-origins:${origins_version}-neoforge,1.21.1")

    // Shared libs
    localRuntime("top.theillusivec4.curios:curios-neoforge:${curios_version}")
    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}:api")
    localRuntime("com.illusivesoulworks.caelus:caelus-neoforge:${caelus_version}")
    compileOnly("com.illusivesoulworks.caelus:caelus-neoforge:${caelus_version}")
    implementation("dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}")
    implementation("software.bernie.geckolib:geckolib-neoforge-${mc_version}:${geckolib_version}")
    localRuntime("curse.maven:attributefix-280510:7115922")
    localRuntime("curse.maven:prickle-1023259:6961457")   // required by attributefix
    localRuntime("curse.maven:bookshelf-228525:7606240")  // required by attributefix

    // Config
    implementation("curse.maven:fzzy-config-1005914:7568897")
    implementation("thedarkcolour:kotlinforforge-neoforge:${kotlin_for_forge_version}")

    // Leveling. Dynamic Difficulty replaces Auto Leveling; raven_core reports the JLF level to it.
    implementation("curse.maven:justleveling-fork-1073400:8555544")
    implementation("dev.muon.dynamic_difficulty:dynamic_difficulty-neoforge:${dynamic_difficulty_version}")

    // Iron's Spells n Spellbooks
    implementation("io.redspace:irons_spellbooks:${irons_version}")
    implementation("io.redspace:irons_lib:${irons_lib_version}")

    // Apotheosis. 1.21.1 moved enchanting into Apothic Enchanting.
    implementation("dev.shadowsoffire:Placebo:${mc_version}-${placebo_version}")
    implementation("dev.shadowsoffire:ApothicAttributes:${mc_version}-${attributeslib_version}")
    implementation("dev.shadowsoffire:Apotheosis:${mc_version}-${apotheosis_version}")
    implementation("dev.shadowsoffire:ApothicEnchanting:${mc_version}-${apothic_enchanting_version}")
    // Apotheosis 8.7 registers apotheosis:sigil_of_withdrawal through Apothic Spawners.
    localRuntime("dev.shadowsoffire:ApothicSpawners:${mc_version}-${apothic_spawners_version}")

    // Survival / social
    implementation("curse.maven:legendary-survival-overhaul-840254:8597620")
    implementation("maven.modrinth:thief:${thief_version}")
    implementation("maven.modrinth:hardcore-revival:${hardcore_revival_version}")
    localRuntime("curse.maven:balm-531761:8645517")
    implementation("maven.modrinth:appleskin:${appleskin_version}")

    // Combat / camera / storage
    implementation("maven.modrinth:better-combat:${better_combat_version}")
    compileOnly("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")
    implementation("curse.maven:shoulder-surfing-reloaded-243190:8725628")
    implementation("curse.maven:sophisticated-backpacks-422301:8687841")
    implementation("curse.maven:sophisticated-core-618298:8705083")

    // RPGDO + AttributeSetter
    compileOnly "curse.maven:rpgdamageoverhaul-1293843:8777705"
    // shelved: localRuntime "curse.maven:rpgdamageoverhaul-1293843:8777705"
    compileOnly "curse.maven:attribute-setter-1064034:8777532"
    // shelved: localRuntime "curse.maven:attribute-setter-1064034:8777532"

    // Mobs: wildshape forms, familiars, spell targets
    implementation("curse.maven:naturalist-627986:8663845")
    implementation("maven.modrinth:hybrid-aquatic:${hybrid_aquatic_version}")
    localRuntime("maven.modrinth:biolith:${biolith_version}")             // hybrid_aquatic requires it
    localRuntime("maven.modrinth:lithostitched:${lithostitched_version}") // hybrid_aquatic requires it
    implementation("maven.modrinth:luminous-beasts:${luminous_beasts_version}")
    implementation("curse.maven:lendercataclysm-551586:8706841")
    implementation("curse.maven:lionfish-api-1001614:8345326")
    localRuntime("curse.maven:mowzies-mobs-250498:7760267")
    localRuntime("curse.maven:iceandfire-ce-1040076:8683031")
    compileOnly("curse.maven:iceandfire-ce-1040076:8683031")
    localRuntime("curse.maven:uranus-1010827:8587525")
    compileOnly("curse.maven:uranus-1010827:8587525")
    localRuntime("curse.maven:jupiter-1072905:7738312")
    compileOnly("curse.maven:jupiter-1072905:7738312")
    localRuntime("curse.maven:alshanexs-familiars-1171602:8966342")
    localRuntime("curse.maven:familiarslib-1316458:8966334")
    localRuntime("curse.maven:dummmmmmy-225738:8903254")
    localRuntime("curse.maven:selene-499980:8941470") // Moonlight Lib, required by dummmmmmy

    // Dragonborn wings, utilizing O-Apoli's built-in Icarus compat (apoli:wings)
    implementation("maven.modrinth:icarus:${icarus_version}")
    localRuntime("maven.modrinth:common-network:${common_network_version}")
    localRuntime("maven.modrinth:sparkweave:${sparkweave_version}")
    localRuntime("maven.modrinth:resourceful-config:${resourceful_config_version}")

    compileOnly "curse.maven:icarus-rewinged-1584283:8516781"
    localRuntime "curse.maven:icarus-rewinged-1584283:8516781"

    // Bard instruments
    implementation("maven.modrinth:immersive-melodies:${immersive_melodies_version}")

    // Raven's High Fantasy's Iron's Spellbooks addons, dev runtime only
    // (flatDir "RavenPackMods")
    // Important: Spell dump and spell tags need to see the whole pool.
    localRuntime("pack:gtbcs_geomancy_plus:1.1.0-1.21.1")
    localRuntime("pack:gtbcs_spell_lib:2.2.0-1.21.1")
    localRuntime("pack:discerning_the_eldritch:1.4.4-1.21")
    localRuntime("pack:aces_spell_utils:1.2.7.2-1.21.1")
    localRuntime("pack:azurelib-neo:1.21.1-3.1.11")
    localRuntime("pack:prometheus-neoforge:1.21-1.2.5")
    localRuntime("pack:soul-fire-d-neoforge:1.21-6.1.0")
    localRuntime("pack:cobweb-neoforge:1.21-1.4.0")
    localRuntime("pack:hazennstuff:1.4.0.14")
    localRuntime("pack:hazentouvelib:1.0.9")
    localRuntime("pack:tunes_n_tomes:1.1.0-HOTFIX")
    localRuntime("pack:cataclysm_spellbooks:1.1.14-1.21")
    localRuntime("pack:legendary_spellbooks:1.21.1+neo-0.3.2")
    localRuntime("pack:ess_requiem:0.1.7a")
    localRuntime("pack:elemental_synergies:1.1.1")
    localRuntime("pack:magic_realms:1.3")
    localRuntime("pack:rpg_dialogue:neoforge-1.21.1-1.0.4")
    localRuntime("pack:aero_additions:1.2.8")
    localRuntime("pack:irons_apothic:2.2.5")
    localRuntime("pack:irons_jewelry:1.21.1-2.0.2")
    localRuntime("pack:atlas_api:1.21.1-1.2.0")                    // required by irons_jewelry
    localRuntime("vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE")  // apprentice_codex needs 93+; Apotheosis pulls 87

    // Clockwork
    compileOnly("pack:clockwork-neoforge:1.21.1-1.1.5")
    localRuntime("pack:clockwork-neoforge:1.21.1-1.1.5")
    compileOnly("pack:knightlib-neoforge:1.21.1-2.0.3")            // required by clockwork
    localRuntime("pack:knightlib-neoforge:1.21.1-2.0.3")

    // FTB
    implementation("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}")
    implementation("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}")
    implementation("dev.architectury:architectury-neoforge:${architectury_version}")
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            modGroup       : modGroup,
            modid          : modid,
            version        : version,
            modName        : modName,
            author         : author,
            desc           : desc,
            mcVersion      : mc_version,
            mcVersionRange : mc_version_range,
            javaVersion    : javaVersion,
            neoVersion     : neo_version,
            neoVersionRange: neo_version_range,
            loaderRange    : loader_version_range
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : project.modName,
                "Specification-Vendor"    : project.author,
                "Specification-Version"   : archiveVersion,
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : archiveVersion,
                "Implementation-Vendor"   : project.author,
                "Built-On-Minecraft"      : project.mc_version
        ])
    }
}

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('javadoc', Javadoc).configure {
    failOnError = false
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.withType(GenerateModuleMetadata) {
    enabled = false
}

tasks.register('sendToModpack', Copy) {
    group = 'publishing'
    dependsOn 'jar'
    from tasks.jar.archiveFile
    into "C:\\Users\\renpi\\curseforge\\minecraft\\Instances\\Raven's High Fantasy\\mods"
    rename { String fileName ->
        fileName.replace(project.version.toString(), "dev")
    }
    doLast {
        println "Mod JAR sent to modpack folder: ${tasks.jar.archiveFileName.get()}"
    }
}

publishMods {
    file = tasks.jar.archiveFile
    modLoaders.add("neoforge")
    changelog = new File("$project.rootDir/CHANGELOG.md").getText('UTF-8')
    version = "${project.version}"
    type = STABLE
    displayName = "NeoForge-${project.version}"

    curseforge {
        projectId = "${curseforge_project}"
        accessToken = System.getenv("CF_TOKEN")

        minecraftVersions.add("${mc_version}")
        javaVersions.add(JavaVersion.VERSION_21)

        client = true
        server = true

        requires("raven-core")
        requires("apoli")
        requires("o-origins")
        requires("irons-spells-n-spellbooks")
        requires("justleveling-fork")
        requires("apotheosis")
        requires("apothic-enchanting")
    }
}

tasks.named('publishMods') {
    dependsOn 'publishAllPublicationsToMuonRepository'
}
tasks.withType(me.modmuss50.mpp.PublishModTask).configureEach {
    mustRunAfter 'publishAllPublicationsToMuonRepository'
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = 'raven-dnd-origins'
            artifact(tasks.named('jar'))
            artifact(tasks.named('sourcesJar', Jar))
            artifact(tasks.named('javadocJar', Jar))
        }
    }
    repositories {
        maven {
            name = "Muon"
            url = uri(System.getenv("MAVEN_URL") ?: "https://maven.muon.rip/releases")
            credentials {
                username = System.getenv("MAVEN_USERNAME")
                password = System.getenv("MAVEN_PASSWORD")
            }
            authentication {
                create(BasicAuthentication)
            }
        }
        maven {
            name = 'localMaven'
            url = uri(System.getProperty("user.home") + "/.m2/repository")
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
