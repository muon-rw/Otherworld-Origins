modLoader="javafml"
loaderVersion="${loaderRange}"
license="ARR"

[[mods]]
modId="${modid}"
version="${version}"
displayName="${modName}"
authors="${author}"
description='''${desc}'''

[[mixins]]
config="${modid}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${modid}]]
    modId="neoforge"
    type="required"
    versionRange="${neoVersionRange}"
    ordering="NONE"
    side="BOTH"

